

## 1. כמה containers ירוצו וכמה images ייבנו?

ירוצו שני containers, אחד לכל service.

שני השירותים משתמשים באותו Dockerfile ובאותו קוד.
אם שניהם משתמשים ב-image משותף אחד, התשובה היא image אחד
ושני containers.

בקובץ שכתבנו מוגדר build לכל service, ללא שם image משותף.
לכן Compose נותן לכל שירות שם image נפרד. תוכן ה-images
ושכבות הבנייה יכולים להיות משותפים, ואין צורך לבנות הכול מחדש פעמיים.

## 2. מה יחזירו הכתובות?

הכתובת http://localhost:9001/hello/Rivka תחזיר:

```json
{"message": "Shalom, Rivka!"}
```

הכתובת http://localhost:9002/hello/Rivka תחזיר:

```json
{"message": "Hello, Rivka!"}
```

ההבדל נובע מהערך של משתנה הסביבה GREETING בכל שירות.

## 3. למה הפורטים במחשב שונים ובקונטיינרים זהים?

באותה כתובת IP במחשב אי אפשר ששני שירותים יתפסו
בו־זמנית את אותו פורט TCP.

לכל קונטיינר יש סביבת רשת נפרדת, ולכן שניהם יכולים
להאזין לפורט 8000 בתוכם.

פורט 9001 במחשב מפנה לקונטיינר העברי,
ופורט 9002 מפנה לקונטיינר האנגלי.

## 4. איך מוסיפים שירות בצרפתית?

מוסיפים תחת services את השירות הבא,
באותה הזחה כמו שני השירותים האחרים:

```yaml
  # שירות שמחזיר ברכה בצרפתית
  greeter-fr:
    build:
      context: ../../02-docker-basics/homework/docker-file-greeter
    environment:
      GREETING: Bonjour
    ports:
      - "9003:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
```

## 5. למה greeter לא צריך volume ו-postgres כן?

greeter מחזיר ברכה ואינו שומר נתונים שצריכים להישאר
לאחר מחיקת הקונטיינר. הקוד שלו כבר נמצא ב-image,
ולכן אין צורך ב-volume לצורך המשימה.

Postgres שומר נתונים במסד נתונים.
כדי שהנתונים יישארו גם לאחר מחיקת הקונטיינר והקמתו מחדש,
שומרים אותם ב-volume, שאורך החיים שלו נפרד מהקונטיינר.
